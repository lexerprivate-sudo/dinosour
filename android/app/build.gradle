apply plugin: 'com.android.application'

android {
    namespace 'com.dinosour.app'
    compileSdk 35
    defaultConfig {
        applicationId "com.dinosour.app"
        minSdk 26
        targetSdk 35
        versionCode (project.hasProperty('versionCode') ? project.property('versionCode') as int : 20014)
        versionName (project.hasProperty('versionName') ? project.property('versionName') : '2.0.14')
    }
    signingConfigs {
        debug {
            storeFile file('../../mobile/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation('com.github.TeamNewPipe.NewPipeExtractor:extractor:v0.24.2') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
